---

- name: Install usefull packages
  ansible.builtin.apt:
    name: "{{ docker_usefull_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: "{{ docker_keyring_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: "{{ docker_gpg_dest }}"
    mode: "0644"
    owner: root
    group: root

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_architecture
  changed_when: false

- name: Add Docker APT repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: "{{ docker_apt_source_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: started
    enabled: true

- name: Add users to Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Create Docker project directory
  ansible.builtin.file:
    path: "{{ docker_project_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Docker volume directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ docker_volume_directories }}"

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.j2
    dest: "{{ docker_project_path }}/{{ docker_compose_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Ensure Docker Compose stack is running
  ansible.builtin.command:
    cmd: docker compose -f "{{ docker_compose_file }}" up -d
    chdir: "{{ docker_project_path }}"
  register: docker_compose_up
  changed_when: >
    'Created' in docker_compose_up.stdout
    or 'Recreated' in docker_compose_up.stdout
    or 'Started' in docker_compose_up.stdout
    or 'Pulled' in docker_compose_up.stdout
  when: docker_stack_state == 'present'

- name: Ensure Docker Compose stack is stopped
  ansible.builtin.command:
    cmd: docker compose -f "{{ docker_compose_file }}" down
    chdir: "{{ docker_project_path }}"
  register: docker_compose_down
  changed_when: >
    'Removed' in docker_compose_down.stdout
    or 'Network' in docker_compose_down.stdout
  when: docker_stack_state == 'absent'
